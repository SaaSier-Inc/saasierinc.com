<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  
  <!-- Blast radius rings (the core concept) -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="240" r="105" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="240" r="70" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.4"/>
  
  <!-- Center node (the PR) -->
  <circle cx="256" cy="240" r="32" fill="url(#accent)"/>
  
  <!-- Impact lines radiating out -->
  <line x1="280" y1="218" x2="340" y2="160" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  <circle cx="348" cy="152" r="10" fill="#3b82f6" opacity="0.6"/>
  
  <line x1="284" y1="248" x2="370" y2="260" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  <circle cx="378" cy="262" r="8" fill="#3b82f6" opacity="0.5"/>
  
  <line x1="268" y1="268" x2="310" y2="340" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  <circle cx="316" cy="348" r="12" fill="#3b82f6" opacity="0.6"/>
  
  <line x1="232" y1="260" x2="175" y2="320" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  <circle cx="168" cy="328" r="9" fill="#3b82f6" opacity="0.5"/>
  
  <line x1="228" y1="228" x2="160" y2="185" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  <circle cx="152" cy="178" r="11" fill="#3b82f6" opacity="0.6"/>
  
  <line x1="248" y1="210" x2="220" y2="130" stroke="#3b82f6" stroke-width="3" opacity="0.7"/>
  <circle cx="216" cy="122" r="7" fill="#3b82f6" opacity="0.4"/>
  
  <!-- Code bracket in center -->
  <text x="244" y="250" font-family="monospace" font-size="32" font-weight="bold" fill="white" text-anchor="middle">&lt;/&gt;</text>

</svg>
